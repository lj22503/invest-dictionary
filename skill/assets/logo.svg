<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mangofolio 投资词典">
  <title>Mangofolio 投资词典</title>
  <defs>
    <linearGradient id="mf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFCF5"/>
      <stop offset="1" stop-color="#F2E4CB"/>
    </linearGradient>
    <radialGradient id="mf-body" cx="0.36" cy="0.3" r="0.82">
      <stop offset="0" stop-color="#FFC65C"/>
      <stop offset="0.55" stop-color="#FB9A22"/>
      <stop offset="1" stop-color="#E47600"/>
    </radialGradient>
    <radialGradient id="mf-sheen" cx="0.32" cy="0.24" r="0.52">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mf-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41765A"/>
      <stop offset="1" stop-color="#1C3F2E"/>
    </linearGradient>
    <linearGradient id="mf-mark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="0.6" stop-color="#FFF4DF"/>
      <stop offset="1" stop-color="#F0DAB8"/>
    </linearGradient>
    <filter id="mf-soft" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#A85000" flood-opacity="0.26"/>
    </filter>
    <clipPath id="mf-clip">
      <path d="M286 154 C 330 150 382 196 399 274 C 415 352 364 440 286 440 C 208 440 157 352 173 274 C 190 196 242 150 286 154 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#mf-bg)"/>

  <g transform="translate(-30,0)">
    <!-- 芒果本体 -->
    <path d="M286 154 C 330 150 382 196 399 274 C 415 352 364 440 286 440 C 208 440 157 352 173 274 C 190 196 242 150 286 154 Z" fill="url(#mf-body)"/>
    <g clip-path="url(#mf-clip)">
      <rect x="140" y="140" width="280" height="310" fill="url(#mf-sheen)"/>
    </g>

    <!-- 书签飘带（左移，完整露出顶端） -->
    <path d="M272 172 L 304 172 L 304 338 L 288 318 L 272 338 Z"
          fill="url(#mf-mark)" filter="url(#mf-soft)"/>
    <path d="M272 172 L 279 172 L 279 332 L 272 338 Z" fill="#E4C79E" opacity="0.5"/>

    <!-- 叶（芒果蒂） -->
    <path d="M306 150 C 320 104 358 80 396 82 C 394 122 362 152 316 158 Z" fill="url(#mf-leaf)"/>
    <path d="M312 150 C 334 124 362 104 390 94" stroke="#8FC0A6" stroke-width="3.6" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>
</svg>
