<style>
:root {
  --paper: #F5F2EC;
  --cinnabar: #C43A31;
  --ink: #2C2C2C;
  --ink-light: #5A5A5A;
  --border: #D9D4CC;
  --card-bg: #FFFFFF;
  --shadow: 0 2px 8px rgba(44,44,44,0.06);
  --shadow-hover: 0 4px 16px rgba(196,58,49,0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.6;
  min-height: 100vh;
}

h1, h2, h3, h4 { font-family: "Noto Serif SC", "KaiTi", "STKaiti", serif; }

/* Hero */
.hero {
  text-align: center;
  padding: 80px 20px 48px;
  position: relative;
  background: linear-gradient(180deg, rgba(196,58,49,0.03) 0%, transparent 100%);
  border-bottom: 1px solid var(--border);
}
.hero h1 {
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 900;
  color: var(--ink);
  letter-spacing: 0.08em;
  margin-bottom: 8px;
}
.hero .en-title {
  font-family: "Noto Serif SC", serif;
  font-size: 1.1rem;
  color: var(--cinnabar);
  letter-spacing: 0.15em;
  font-style: italic;
  margin-bottom: 16px;
}
.hero .subtitle {
  font-size: 1.05rem;
  color: var(--ink-light);
  margin-bottom: 32px;
}
.hero .search-wrap {
  display: flex;
  justify-content: center;
}
.hero input[type="search"] {
  width: 100%;
  max-width: 480px;
  padding: 12px 20px;
  font-size: 1rem;
  border: 1px solid var(--border);
  border-radius: 24px;
  background: var(--card-bg);
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
}
.hero input[type="search"]:focus {
  border-color: var(--cinnabar);
  box-shadow: 0 0 0 3px rgba(196,58,49,0.1);
}
.hero input[type="search"]::placeholder {
  color: #B0A99E;
}

/* Stats bar */
.stats-bar {
  text-align: center;
  padding: 16px 20px;
  font-size: 0.9rem;
  color: var(--ink-light);
  letter-spacing: 0.05em;
  border-bottom: 1px solid var(--border);
}

/* Main content */
.main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 20px 80px;
}

/* Chapter sections */
.chapter-section {
  margin-bottom: 40px;
}
.chapter-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid var(--border);
  transition: color 0.2s;
}
.chapter-header:hover { color: var(--cinnabar); }
.chapter-header .left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.chapter-header .ch-name {
  font-family: "Noto Serif SC", "KaiTi", serif;
  font-size: 1.25rem;
  font-weight: 700;
}
.chapter-header .ch-count {
  font-size: 0.85rem;
  color: var(--ink-light);
  background: rgba(196,58,49,0.08);
  padding: 2px 10px;
  border-radius: 12px;
}
.chapter-header .arrow {
  font-size: 1.2rem;
  transition: transform 0.3s;
  color: var(--ink-light);
}
.chapter-header.collapsed .arrow {
  transform: rotate(-90deg);
}

/* Entry cards grid */
.entry-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  padding: 16px 0;
  overflow: hidden;
  transition: max-height 0.4s ease, opacity 0.3s, padding 0.3s;
  max-height: 5000px;
  opacity: 1;
}
.entry-grid.collapsed {
  max-height: 0;
  opacity: 0;
  padding: 0;
  overflow: hidden;
}

.entry-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  cursor: pointer;
  transition: box-shadow 0.2s, border-color 0.2s, transform 0.2s;
  text-decoration: none;
  display: block;
  color: var(--ink);
}
.entry-card:hover {
  box-shadow: var(--shadow-hover);
  border-color: var(--cinnabar);
  transform: translateY(-2px);
}
.entry-card .card-num {
  font-family: "Noto Serif SC", serif;
  font-size: 0.78rem;
  color: var(--cinnabar);
  margin-bottom: 4px;
  font-weight: 700;
}
.entry-card .card-title {
  font-family: "Noto Serif SC", "KaiTi", serif;
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--ink);
}
.entry-card .card-hook {
  font-size: 0.85rem;
  color: var(--ink-light);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* No results */
.no-results {
  text-align: center;
  padding: 80px 20px;
  color: var(--ink-light);
  font-size: 1.1rem;
  display: none;
}
.no-results.show { display: block; }

/* Footer */
.footer {
  text-align: center;
  padding: 32px 20px;
  font-size: 0.85rem;
  color: var(--ink-light);
  border-top: 1px solid var(--border);
}

/* Responsive */
@media (max-width: 900px) {
  .entry-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .entry-grid { grid-template-columns: 1fr; }
  .hero { padding: 48px 16px 32px; }
  .chapter-header .ch-name { font-size: 1.05rem; }
}

/* Hidden */
.hidden { display: none !important; }

<script>
// Embedded data → 动态加载 dictionary.json（根治 ALL_ENTRIES 与词条库不同步问题）
var ALL_ENTRIES = [];
var __entriesReady = false;
var __entriesWaiters = [];
function whenEntriesReady(fn) {
  if (__entriesReady) { fn(); } else { __entriesWaiters.push(fn); }
}
function __entriesDone(data) {
  // dictionary.json 字段为 filename，兼容旧代码使用的 file
  ALL_ENTRIES = (data || []).map(function (e) {
    if (e && !e.file) e.file = e.filename;
    if (e && !e.filename) e.filename = e.file;
    return e;
  });
  __entriesReady = true;
  __entriesWaiters.splice(0).forEach(function (fn) { fn(); });
}
fetch('dictionary.json')
  .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function (d) { __entriesDone(d); })
  .catch(function (err) {
    // 兜底：file:// 等 fetch 不可用场景尝试同步 XHR（仅极端情况）
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'dictionary.json', false);
      xhr.send(null);
      __entriesDone(JSON.parse(xhr.responseText));
    } catch (e2) {
      console.error('词条库加载失败', err, e2);
      __entriesDone([]);
    }
  });
whenEntriesReady(function () {
  if (location.search.indexOf('random=1') !== -1) {
    var rand = ALL_ENTRIES[Math.floor(Math.random() * ALL_ENTRIES.length)];
    location.replace('terms/' + encodeURIComponent(rand.file));
  }
});

(function () {
  var form = document.getElementById('hotSubscribeForm');
  if (!form) return;
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('hsEmail');
    var msg = document.getElementById('hsMsg');
    var re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    var val = email.value.trim();
    if (!val || !re.test(val)) {
      msg.textContent = '邮箱格式不对';
      msg.hidden = false;
      return;
    }
    msg.textContent = '订阅中…';
    msg.hidden = false;
    fetch('/api/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: val })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.ok) {
          msg.textContent = '订阅成功，每天给你推热词';
          email.value = '';
        } else {
          msg.textContent = d.error || '订阅失败，请稍后重试';
        }
      })
      .catch(function () {
        msg.textContent = '网络异常，请稍后重试';
      });
  });
})();
(function () {
  var track = document.getElementById('hotTrack');
  var dateEl = document.querySelector('.hot-date');
  if (!track) return;

  function renderItems(items) {
    var html = '';
    items.forEach(function (it) {
      html += '<a class="hot-item" href="' + it.url + '">' +
        '<span class="hot-term"><span class="hot-badge">HOT</span>' + it.title + '</span>' +
        '<span class="hot-desc">' + it.desc + '</span></a>';
    });
    track.innerHTML = html;
  }

  function renderFallback() {
    // 兜底：从词条库取前 3 条经典词条作为默认展示
    whenEntriesReady(function () {
      if (typeof ALL_ENTRIES !== 'undefined' && ALL_ENTRIES.length) {
        var defaults = ALL_ENTRIES.slice(0, 3);
        var html = '';
        defaults.forEach(function (e) {
          html += '<a class="hot-item" href="terms/' + encodeURIComponent(e.file) + '">' +
            '<span class="hot-term"><span class="hot-badge">HOT</span>' + e.title + '</span>' +
            '<span class="hot-desc">今日暂无热词，点开复习这条经典词条。</span></a>';
        });
        track.innerHTML = html;
      }
    });
  }

  function startCarousel() {
    var items = track.querySelectorAll('.hot-item');
    if (items.length < 2) return;
    var step = items[0].offsetHeight;
    var idx = 0;
    setInterval(function () {
      idx++;
      track.style.transform = 'translateY(-' + (idx * step) + 'px)';
      if (idx >= items.length - 1) {
        setTimeout(function () {
          track.style.transition = 'none';
          track.style.transform = 'translateY(0)';
          idx = 0;
          setTimeout(function () { track.style.transition = 'transform 0.5s ease'; }, 30);
        }, 500);
      }
    }, 3500);
  }

  fetch('/api/daily-hot')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.ok && d.items && d.items.length) {
        if (dateEl && d.date) dateEl.textContent = d.date;
        renderItems(d.items);
      } else {
        renderFallback();
      }
      startCarousel();
    })
    .catch(function () {
      renderFallback();
      startCarousel();
    });
})();
var CHAPTER_ORDER = ["第一篇：钱的本质", "第二篇：个人财务底盘", "第三篇：风险护城河", "第四篇：投资武器库 · 股票篇", "第五篇：投资武器库 · 债券与固收篇", "第六篇：投资武器库 · 基金篇", "第七篇：投资武器库 · 其他类", "第八篇：读懂指标 · 估值与业绩篇", "第九篇：读懂指标 · 市场情绪与风险篇", "第十篇：交易规则与摩擦成本", "第十一篇：宏观风向标", "第十二篇：宏观与周期", "第十三篇：衍生品与对冲", "第十四篇：策略与数学", "第十五篇：策略与数学 · 进阶", "第十六篇：金融市场黑话与交易场景", "第十七篇：日常支付与账户管理", "第十八篇：借贷与生活刚需", "第十九篇：人生账本与长期规划", "第二十篇：消费心理与财富品格", "第二十一篇：投资心理与行为陷阱", "第二十二篇：骗局与避坑指南"];

(function() {
  whenEntriesReady(function() {
    var mainContent = document.getElementById('mainContent');
    var noResults = document.getElementById('noResults');
    var searchBox = document.getElementById('searchBox');

  // Group entries by chapter
  var chapterGroups = {};
  CHAPTER_ORDER.forEach(function(ch) { chapterGroups[ch] = []; });
  ALL_ENTRIES.forEach(function(e) {
    if (chapterGroups[e.chapter]) chapterGroups[e.chapter].push(e);
  });

  function buildAll() {
    var html = '';
    CHAPTER_ORDER.forEach(function(chName) {
      var entries = chapterGroups[chName];
      if (!entries) return;
      html += '<section class="chapter-section" id="' + escapeHtml(chName) + '" data-chapter="' + escapeHtml(chName) + '">';
      html += '  <div class="chapter-header" onclick="toggleChapter(this)">';
      html += '    <div class="left"><span class="ch-name">' + escapeHtml(chName) + '</span><span class="ch-count">' + entries.length + ' 词条</span></div>';
      html += '    <span class="arrow">▼</span>';
      html += '  </div>';
      html += '  <div class="entry-grid">';
      entries.forEach(function(e) {
        var hook = e.card_titles && e.card_titles.length > 0 ? e.card_titles[0] : '';
        html += '    <a class="entry-card" href="terms/' + encodeURIComponent(e.file) + '" data-title="' + escapeHtml(e.title) + '">';
        html += '      <div class="card-num">' + escapeHtml(String(e.id).padStart(2, '0')) + '</div>';
        html += '      <div class="card-title">' + escapeHtml(e.title) + '</div>';
        if (hook) html += '      <div class="card-hook">' + escapeHtml(hook) + '</div>';
        html += '    </a>';
      });
      html += '  </div>';
      html += '</section>';
    });
    mainContent.innerHTML = html;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  buildAll();

  // Chapter toggle
  window.toggleChapter = function(header) {
    header.classList.toggle('collapsed');
    var grid = header.nextElementSibling;
    grid.classList.toggle('collapsed');
  };

  // Search
  searchBox.addEventListener('input', function() {
    var q = this.value.trim().toLowerCase();
    var sections = mainContent.querySelectorAll('.chapter-section');
    var anyVisible = false;

    sections.forEach(function(sec) {
      var chName = sec.getAttribute('data-chapter').toLowerCase();
      var cards = sec.querySelectorAll('.entry-card');
      var chMatch = chName.indexOf(q) !== -1;
      var cardVisible = 0;

      cards.forEach(function(card) {
        var title = (card.getAttribute('data-title') || '').toLowerCase();
        if (!q || title.indexOf(q) !== -1 || chMatch) {
          card.classList.remove('hidden');
          cardVisible++;
        } else {
          card.classList.add('hidden');
        }
      });

      if (!q || cardVisible > 0 || chMatch) {
        sec.classList.remove('hidden');
        // auto-expand on search
        var header = sec.querySelector('.chapter-header');
        var grid = sec.querySelector('.entry-grid');
        if (q && header.classList.contains('collapsed')) {
          header.classList.remove('collapsed');
          grid.classList.remove('collapsed');
        }
        if (cardVisible > 0) anyVisible = true;
      } else {
        sec.classList.add('hidden');
      }
    });

      noResults.classList.toggle('show', !anyVisible && !!q);
    });
  });
})();
</script>
